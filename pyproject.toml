[build-system]
requires = ["setuptools>=80,<81", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-knowledge-agent-langgraph"
version = "0.1.2"
description = "Independent evidence-first universal knowledge agent orchestrated by LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{name = "Yunpai"}]
dependencies = [
  "fastapi>=0.120,<1",
  "langgraph==1.2.10",
  "langgraph-checkpoint-sqlite==3.1.1",
  "openai>=2.0,<3",
  "python-dotenv>=1.1,<2",
  "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.9,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
uka-lg = "uka_langgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
